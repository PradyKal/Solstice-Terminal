<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLSTICE · Monte Carlo Simulation Platform</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#06080c;color:#d8dde9;font-family:'JetBrains Mono',monospace;font-size:13px;height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at center,#0e1320 0%,#06080c 70%)}
.hero{text-align:center;max-width:640px;padding:40px 24px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:0.35em;color:#06b6d4;margin-bottom:12px;text-shadow:0 0 20px rgba(6,182,212,0.3)}
.hero p{font-size:12px;line-height:1.8;color:#6b7187;margin-bottom:32px;letter-spacing:0.05em}
.hero .btn{display:inline-block;padding:14px 32px;border:1px solid #06b6d4;color:#06b6d4;
  letter-spacing:0.3em;font-size:11px;font-weight:600;background:rgba(6,182,212,0.05);
  backdrop-filter:blur(8px);transition:all 0.2s;cursor:pointer;text-decoration:none}
.hero .btn:hover{background:#06b6d4;color:#06080c;box-shadow:0 0 32px rgba(6,182,212,0.4)}
.hero .links{position:absolute;bottom:20px;right:24px;font-size:10px;color:#3d4459;letter-spacing:0.2em}
.hero .links a{color:#6b7187;margin-left:16px;text-decoration:none}
.hero .links a:hover{color:#06b6d4}
</style>
</head>
<body>
<div class="hero">
  <h1>SOLSTICE</h1>
  <p>Monte Carlo simulation platform for modeling uncertainty<br>and probabilistic outcomes across any domain.</p>
  <a href="login.html" class="btn">ENTER TERMINAL</a>
  <div class="links">
    <a href="https://github.com/PradyKal/Solstice-Terminal" target="_blank">github</a>
  </div>
</div>
</body>
</html>
