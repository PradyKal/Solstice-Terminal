<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGIN · SOLSTICE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#06080c;color:#d8dde9;font-family:'JetBrains Mono',monospace;font-size:13px;height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:radial-gradient(ellipse at center,rgba(6,182,212,0.04) 0%,transparent 70%),#06080c}
.login-box{width:360px;padding:36px 28px;border:1px solid #1a2030;background:rgba(8,12,20,0.85);backdrop-filter:blur(12px)}
.login-box h2{text-align:center;letter-spacing:0.35em;color:#06b6d4;font-size:14px;margin-bottom:24px;font-weight:600}
form{display:flex;flex-direction:column;gap:10px}
form label{font-size:10px;color:#6b7187;letter-spacing:0.2em}
form input{background:#06080c;border:1px solid #1a2030;color:#d8dde9;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
form input:focus{border-color:#06b6d4}
form button{margin-top:12px;padding:12px;background:rgba(6,182,212,0.05);border:1px solid #06b6d4;color:#06b6d4;
  font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:0.3em;font-size:11px;cursor:pointer;transition:all 0.2s}
form button:hover{background:#06b6d4;color:#06080c;box-shadow:0 0 24px rgba(6,182,212,0.3)}
.error{color:#ef4444;margin-top:12px;min-height:14px;font-size:11px}
.back{display:block;text-align:center;margin-top:20px;color:#3d4459;font-size:10px;letter-spacing:0.2em;text-decoration:none}
.back:hover{color:#6b7187}
</style>
</head>
<body>
<div class="login-box">
  <h2>SOLSTICE</h2>
  <form id="login-form">
    <label>USERNAME</label>
    <input type="text" id="username" placeholder="username" required>
    <label>PASSPHRASE</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <button type="submit">AUTHENTICATE</button>
  </form>
  <div id="error" class="error"></div>
  <a href="index.html" class="back">&larr; back</a>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value;
  var err = document.getElementById('error');
  if (u === 'PradyKal' && p === '@Prady0901') {
    sessionStorage.setItem('solstice_user', u);
    window.location.href = 'terminal.html';
  } else {
    err.textContent = 'AUTHENTICATION FAILED';
  }
});
</script>
</body>
</html>
